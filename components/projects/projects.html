<section id="projects-section" aria-labelledby="projects-heading">
  <div class="projects-heading">
    <p class="eyebrow">// 04 — projects</p>
    <h2 id="projects-heading">My Projects</h2>
    <p class="section-subtitle">
      Selected builds with real problems and real polish.
    </p>
  </div>

  <div id="project-filters" class="project-filters" role="group" aria-label="Filter projects">
    <button type="button" id="filter-all" class="project-filter" aria-pressed="true">All</button>
    <div id="project-group-filters" class="project-group-filters" role="group" aria-label="Project groups"></div>
  </div>

  <div id="project-status" class="project-status" role="status" aria-live="polite">
    <p class="project-status-text">Loading projects…</p>
    <button type="button" id="project-retry" class="project-retry" hidden>Try again</button>
  </div>

  <div id="project-grid" class="project-grid"></div>

  <div id="see-more-btn" class="see-more-btn" hidden>
    <button type="button" id="see-more">See more</button>
  </div>
</section>
