<template id="project-card-template">
  <article class="project-card">
    <div class="project-image">
      <img class="project-image-media" src="" alt="" loading="lazy" />
      <div class="project-image-placeholder" hidden>
        <span>No preview yet</span>
      </div>
    </div>
    <div class="project-body">
      <span class="project-group-badge"></span>
      <h4 class="project-title"></h4>
      <p class="project-goal"></p>
      <button type="button" class="project-read-more" hidden>Read more</button>
      <ul class="project-stack"></ul>
      <div class="project-links">
        <a class="view-code" href="" target="_blank" rel="noopener noreferrer">Code</a>
        <a class="live-demo" href="" target="_blank" rel="noopener noreferrer">Live demo</a>
      </div>
    </div>
  </article>
</template>
