<section id="contact-section" aria-labelledby="contact-heading">
  <div class="contact-heading">
    <p class="eyebrow">// 05 — contact</p>
    <h2 id="contact-heading">Contact Me</h2>
    <p class="section-subtitle">Let’s build something good together.</p>
  </div>

  <!-- <div id="contact-links" class="contact-links" aria-label="Contact links">
    <ul></ul>
  </div> -->

  <form id="contact-form" novalidate>
    <div
      id="contact-status"
      class="contact-status"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <div
      id="form-error-summary"
      class="error-summary"
      role="alert"
      tabindex="-1"
      hidden
    >
      <p class="error-summary-title">Please fix the highlighted fields:</p>
      <div class="error-summary-links"></div>
    </div>
    <fieldset>
      <legend>Send me a message</legend>
      <div class="contact-field">
        <label for="name">Name</label>
        <input
          id="name"
          name="name"
          type="text"
          autocomplete="name"
          required
          aria-describedby="name-error"
        />
        <p id="name-error" class="field-error" hidden></p>
      </div>
      <div class="contact-field">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          required
          aria-describedby="email-error"
        />
        <p id="email-error" class="field-error" hidden></p>
      </div>
      <div class="contact-field">
        <label for="subject">Subject</label>
        <input
          id="subject"
          name="subject"
          type="text"
          autocomplete="off"
          required
          aria-describedby="subject-error"
        />
        <p id="subject-error" class="field-error" hidden></p>
      </div>
      <div class="contact-field">
        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
          rows="6"
          required
          aria-describedby="message-error"
        ></textarea>
        <p id="message-error" class="field-error" hidden></p>
      </div>
      <button type="submit" id="message-me-btn">Send message</button>
    </fieldset>
  </form>
</section>
